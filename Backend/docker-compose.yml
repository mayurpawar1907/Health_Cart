services:
  mysql:
    image: mysql:8.4
    container_name: healthcart-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: healthcart
      MYSQL_USER: healthcart
      MYSQL_PASSWORD: healthcart
    volumes:
      - healthcart_mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  healthcart_mysql:
